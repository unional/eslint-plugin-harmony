name: release
on:
  push:
    branches: [main]

jobs:
  code:
    uses: repobuddy/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true

  # Runs on the default branch immediately before `changeset publish`, so a tarball that
  # trips the gate blocks the release. A `needs:` of release, so it also runs on pushes
  # that only open or update the Version PR rather than publish. Deliberate — it fails
  # closed.
  publish-gate:
    uses: repobuddy/.github/.github/workflows/pnpm-publish-gate.yml@v2
    permissions:
      contents: read

  release:
    uses: repobuddy/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v2
    needs: [code, publish-gate]
    permissions:
      id-token: write
      contents: write
      pull-requests: write
